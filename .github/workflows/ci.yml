# context-capsule — CI: tests and builds on Windows and Linux. The Mac side is tested and built on a Mac
# (capture/tests/run.sh, capture/build.sh): macOS minutes on GitHub cost 10×.
# Runs only when asked: GitHub → Actions → ci → "Run workflow", or `gh workflow run ci`.
# For a release, only the Linux file is needed here (Mac and Windows are built on a Mac):
# `gh workflow run ci -f only=linux-file`. Rust builds are kept between runs (caches), so only what changed is rebuilt.
name: ci
on:
  workflow_dispatch:
    inputs:
      only:
        description: What to run
        type: choice
        options: [everything, linux-file]
        default: everything

jobs:
  mcp:
    if: inputs.only != 'linux-file'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  # The AI parts every app carries, from this commit (ai-parts.yml): context-capsule-mcp for Windows and Linux (one
  # self-contained file each, bun build --compile) and the Claude extension, as the "ai-parts" artifact. The app jobs
  # below download it before building; the Mac's (universal) are built on a Mac: mcp/build-binary.sh.
  ai-parts:
    uses: ./.github/workflows/ai-parts.yml

  # The Windows helper runs on Windows (the Linux one is run where it's built).
  mcp-binary-windows:
    if: inputs.only != 'linux-file'
    needs: ai-parts
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-parts
          path: mcp
      - name: Runs
        shell: bash
        run: mcp/dist-bin/context-capsule-mcp-windows-x64.exe --version && mcp/dist-bin/context-capsule-mcp-windows-x64.exe clients

  core:
    if: inputs.only != 'linux-file'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: capture-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: capture-rs
      - run: cargo test -p context-capsule-core
      - run: cargo clippy -p context-capsule-core --all-targets -- -D warnings

  # The release build carries the helper and the extension inside the exe (build.rs stops without them).
  windows-recorder:
    if: inputs.only != 'linux-file'
    needs: ai-parts
    runs-on: windows-latest
    defaults:
      run:
        working-directory: capture-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ai-parts
          path: mcp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: capture-rs
      - run: cargo test -p context-capsule-windows
      - run: cargo clippy -p context-capsule-windows --all-targets -- -D warnings
      - run: cargo build --release -p context-capsule-windows
      - uses: actions/upload-artifact@v4
        with:
          name: context-capsule-windows
          path: capture-rs/target/release/context-capsule.exe

  linux-recorder:
    if: inputs.only != 'linux-file'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux box (kept between runs)
        uses: docker/build-push-action@v6
        with:
          context: capture-rs/ci
          file: capture-rs/ci/linux.Dockerfile
          tags: context-capsule-linux
          load: true
          cache-from: type=gha,scope=linux-box
          cache-to: type=gha,mode=max,scope=linux-box
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-docker
            capture-rs/target
          key: linux-recorder-${{ hashFiles('capture-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-recorder-${{ hashFiles('capture-rs/Cargo.lock') }}-
            linux-recorder-
      - name: Test, lint and build
        run: >
          docker run --rm -v "$PWD:/work" -v "$PWD/.cargo-docker:/usr/local/cargo/registry" -w /work/capture-rs context-capsule-linux sh -c
          "rustup component add clippy &&
          cargo test -p context-capsule-linux &&
          cargo clippy -p context-capsule-linux --all-targets -- -D warnings &&
          cargo build --release -p context-capsule-linux"

  # The Linux release file, Context-Capsule-<version>-x86_64.AppImage (built in the same Linux box), with this
  # commit's helper inside (appimage.sh stops without it).
  appimage:
    needs: ai-parts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ai-parts
          path: mcp
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux box (kept between runs)
        uses: docker/build-push-action@v6
        with:
          context: capture-rs/ci
          file: capture-rs/ci/linux.Dockerfile
          tags: context-capsule-linux
          load: true
          cache-from: type=gha,scope=linux-box
          cache-to: type=gha,mode=max,scope=linux-box
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-docker
            capture-rs/target-appimage
          key: appimage-${{ hashFiles('capture-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            appimage-${{ hashFiles('capture-rs/Cargo.lock') }}-
            appimage-
      - name: Build the AppImage
        run: docker run --rm -v "$PWD:/work" -v "$PWD/.cargo-docker:/usr/local/cargo/registry" -w /work/capture-rs context-capsule-linux sh linux/appimage.sh
      # The packaged file holds this commit's helper, and it runs (extracted: no FUSE needed).
      - name: The AppImage carries the helper
        run: |
          image=$(ls "$PWD"/capture-rs/target-appimage/Context-Capsule-*-x86_64.AppImage)
          check=$(mktemp -d) && cd "$check"
          cp "$image" app.AppImage && chmod +x app.AppImage # made by root in Docker: a copy of our own
          ./app.AppImage --appimage-extract usr/bin/context-capsule-mcp >/dev/null
          cmp squashfs-root/usr/bin/context-capsule-mcp "$GITHUB_WORKSPACE/mcp/dist-bin/context-capsule-mcp-linux-x64"
          squashfs-root/usr/bin/context-capsule-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: context-capsule-linux-appimage
          path: capture-rs/target-appimage/Context-Capsule-*-x86_64.AppImage
