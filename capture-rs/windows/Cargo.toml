# context-capsule — windows: the Windows recorder (tray app) on the shared core.
[package]
name = "context-capsule-windows"
description = "Context Capsule recorder for Windows: tray, capture picker, UI Automation, Windows OCR, voice notes"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "context-capsule"
path = "src/main.rs"

[features]
default = ["voice"]
# On-device voice notes: whisper.cpp + the microphone through cpal.
voice = ["dep:whisper-rs", "dep:cpal"]

[dependencies]
context-capsule-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
serde_json = "1"
# The any-AI program inside the exe is zstd-compressed (build.rs); unpacked once, next to the exe.
ruzstd = "0.8"

[build-dependencies]
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
# The shared window (ui/) in WebView2: the page served from inside the exe, its bridge, Mica behind it.
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
webview2-com = "0.39"
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Media_Audio",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "UI_ViewManagement",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
