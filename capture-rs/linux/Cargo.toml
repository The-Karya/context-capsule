# context-capsule — linux: the Linux recorder (tray, portal ScreenCast + PipeWire, AT-SPI, Tesseract, whisper.cpp).
[package]
name = "context-capsule-linux"
description = "Context Capsule recorder for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "context-capsule"
path = "src/main.rs"

[features]
default = ["voice", "window"]
# On-device voice notes: whisper.cpp + the microphone. Off: voice notes say they are not built in.
voice = ["dep:whisper-rs", "dep:cpal", "dep:sha2"]
# The Context Capsule window (Home, Capsules, Projects, Settings, Help): GTK 4.8+ and libadwaita 1.2+.
# Off: tray and hotkeys only.
window = ["dep:gtk", "dep:adw"]

[dependencies]
context-capsule-core = { path = "../core" }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "wrappers", "tokio"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
pipewire = "0.10"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
x11rb = { version = "0.14", features = ["randr", "xinput"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# https downloads (rustls): updates, and the speech model.
ureq = "3"
cpal = { version = "0.18", optional = true }
sha2 = { version = "0.11", optional = true }
whisper-rs = { version = "0.16", optional = true }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_2"], optional = true }
